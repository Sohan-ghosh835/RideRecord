  <script>(function(){try{var t=null;try{t=localStorage.getItem('rr-theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#000000':'#ffffff')}catch(e){document.documentElement.setAttribute('data-theme','light')}})();</script>
